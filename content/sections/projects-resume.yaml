title: Projects
entries:
  - heading: Blazar Population ML
    right: Jan 2026 – Present
    sub: Scientific ML (Python, scikit-learn, PyTorch)
    sub_right: "[github.com/altjerue/ilwikak-ml](https://github.com/altjerue/ilwikak-ml)"
    bullets:
      - >-
        Applying classical ML and Bayesian inference to the Fermi-LAT
        4LAC-DR3 catalog (3,407 sources) to recover physical jet
        parameters from multi-wavelength data.
      - >-
        Building a neural-network emulator of the physics-based Tleco model
        that maps physical jet parameters to observable spectral energy
        distributions, to be validated against Tleco output (in progress).
      - >-
        Forecasting blazar gamma-ray flares with a time-series foundation
        model fine-tuned on Tleco-generated synthetic light curves.
