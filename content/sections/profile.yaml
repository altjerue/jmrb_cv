title: Professional Summary
paragraph: >-
  Computational physicist (Ph.D.) with 10+ years writing scientific code,
  running computational experiments, and validating models against data.
  Currently evaluates frontier language models on expert-level physics
  reasoning and builds neural-network surrogates of expensive simulations.
  Author of open-source scientific libraries (Paramo, Tleco; ApJ 2024)
  with code review and unit testing, and mentor of graduate students.
