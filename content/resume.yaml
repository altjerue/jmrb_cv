# Single source for the plain resume. `node tools/build.js content/resume.yaml`
# writes <output>.tex and <output>.docx from it.
#
# Inline markup (works in every text field): **bold**, *italic*,
# [link text](https://url). Write plain Unicode (–, ×, ², é); the build
# escapes LaTeX special characters (& % $ # _ ~ ^ \ { }) itself.

output: RuedaBecerrilJM-resume-plain
# moderncv version: writes <output>.tex plus <sections_dir>/<file>.tex for
# each section below (every section needs a `file:`).
moderncv:
  output: RuedaBecerrilJM-resume
  style: resume
  sections_dir: Sections
name: Jesús M. Rueda-Becerril
credentials: Ph.D.
contact:
  - Seattle, WA
  - "[jm.ruebe@gmail.com](mailto:jm.ruebe@gmail.com)"
  - +1 (765) 430-2330
  - "[linkedin.com/in/jeruebe](https://linkedin.com/in/jeruebe)"
  - "[altjerue.github.io](https://altjerue.github.io)"

sections:
  - title: Professional Summary
    file: profile_resume
    paragraph: >-
      Computational Scientist with a PhD in Physics and over ten years of
      experience building and running high-performance numerical algorithms and
      physics-based simulations. Expertise in scientific machine learning and
      geospatial data analysis. Strong mathematical foundations with a track
      record of architecting open-source simulation libraries, leading funded
      research projects, and translating complex physical models into
      production-quality scientific software. Experienced working across
      cross-functional research and engineering teams.

  - title: Skills
    file: skills_resume
    skills:
      - label: Languages
        text: C/C++, Python, Fortran 95, Rust, R, Java, SQL, Julia, Shell
      - label: ML & Data
        text: >-
          Scientific machine learning, PyTorch, TensorFlow, scikit-learn,
          NumPy, SciPy, Pandas, Astropy, ML-assisted parameter estimation,
          gradient-based optimization, SVM, random forest, neural networks
      - label: HPC & Parallel
        text: OpenMP, OpenACC (GPU offloading), MPI, SLURM, PBS, HDF5
      - label: Tools
        text: Git, Docker, Azure, Jenkins, Kafka, Jira, QGIS, ParaView, VisIt

  - title: Experience
    file: experience_resume
    entries:
      - heading: Independent Contractor
        right: Jan 2026 – Present
        sub: Mercor
        sub_right: Remote
        intro: >-
          Physics subject-matter expert evaluating frontier language models
          for a leading AI lab.
        bullets:
          - >-
            Reviewed 50+ expert-level problems in physics, hydrodynamics,
            astrophysics, and cosmology; wrote original prompts that stumped
            frontier models.

      - heading: Spatial Data Scientist
        right: May 2025 – Jan 2026
        sub: TealWaters
        sub_right: Seattle, WA
        intro: >-
          Built geospatial ML pipelines and optimized terrain-analysis code
          for wetland mapping.
        bullets:
          - >-
            Optimized the terrain-modeling code that computes elevation
            derivatives from 1 m, 3 m, and 10 m DEMs over 20 tiles, improving
            its computational performance.
          - >-
            Mapped wetland probability across the 2,160 km² Skykomish
