sections:
  - title: Professional Summary
    paragraph: >-
      Computational physicist with a PhD in Physics and ten years of experience
      building and running simulation codes for relativistic plasmas. Author of
      Paramo, an open-source Fortran library that solves the Fokker-Planck
      equation coupled to radiative transfer. Led an upgrade of the PatchworkMHD
      code on Frontera and used gradient-based optimization to calibrate model
      parameters against observations. Nine publications and a NASA grant won
      and led as a postdoc.

  - title: Skills
    skills:
      - label: Simulation
        text: >-
          Kinetic plasma modeling (Fokker–Planck), radiative processes
          (synchrotron, inverse Compton), radiative transfer, relativistic
          MHD, Lagrangian particle dynamics, numerical PDEs,
          finite-difference/finite-volume methods, numerical linear algebra,
          parameter estimation, uncertainty quantification
      - label: HPC & Parallel
        text: OpenMP, OpenACC (GPU offloading), MPI, SLURM, PBS, HDF5
      - label: ML & Data
        text: >-
          Scientific ML, PyTorch, TensorFlow, scikit-learn, NumPy, SciPy,
          Pandas, Astropy, random forest, SVM, neural networks,
          gradient-based optimization, parameter estimation
      - label: Languages
        text: Python, C/C++, Fortran, Rust, R, SQL, Java, Julia, Shell
      - label: Tools
        text: Git, Docker, Jenkins, QGIS, ParaView, VisIt

