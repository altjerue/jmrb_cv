# Main file for the resume: header plus the list of sections to include. Most
# sections are shared with the CV; skills, experience, education and projects
# have shorter resume versions (sections/*-resume.yaml).
# `node tools/build.js content/resume.yaml` writes <output>.tex and
# <output>.docx from it.
#
# Inline markup (works in every text field): **bold**, *italic*,
# [link text](https://url). Write plain Unicode (–, ×, ², é); the build
# escapes LaTeX special characters (& % $ # _ ~ ^ \ { }) itself.

output: resume-RuedaBecerrilJM
name: Jesús M. Rueda-Becerril
credentials: Ph.D.
