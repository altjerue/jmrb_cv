# Single source for the plain resume. `node tools/build.js content/resume.yaml`
# writes <output>.tex and <output>.docx from it.
#
# Inline markup (works in every text field): **bold**, *italic*,
# [link text](https://url). Write plain Unicode (–, ×, ², é); the build
# escapes LaTeX special characters (& % $ # _ ~ ^ \ { }) itself.

output: resume-RuedaBecerrilJM-plain
# moderncv version: writes <output>.tex plus <sections_dir>/<file>.tex for
# each section below (every section needs a `file:`).
moderncv:
  output: resume-RuedaBecerrilJM
  style: resume
  sections_dir: Sections
name: Jesús M. Rueda-Becerril
credentials: Ph.D.
contact:
  - Seattle, WA
  - "[jm.ruebe@gmail.com](mailto:jm.ruebe@gmail.com)"
  - +1 (765) 430-2330
  - "[linkedin.com/in/jeruebe](https://linkedin.com/in/jeruebe)"
  - "[altjerue.github.io](https://altjerue.github.io)"

sections:
  # MARK: - Profile
  - !include resume/profile.yaml

  # MARK: - Skills
  - !include resume/skills.yaml

  # MARK: - Experience
  - !include resume/experience.yaml

  # MARK: - Education
  - !include resume/education.yaml

  # MARK: - Projects
  - !include resume/projects.yaml

  # MARK: - Publications
  - !include resume/publications.yaml
