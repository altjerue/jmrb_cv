# Single source for the plain resume. `node tools/build.js content/resume.yaml`
# writes <output>.tex and <output>.docx from it.
#
# Inline markup (works in every text field): **bold**, *italic*,
# [link text](https://url). Write plain Unicode (–, ×, ², é); the build
# escapes LaTeX special characters (& % $ # _ ~ ^ \ { }) itself.

output: RuedaBecerrilJM-resume-plain
# moderncv version: writes <output>.tex plus <sections_dir>/<file>.tex for
# each section below (every section needs a `file:`).
moderncv:
  output: RuedaBecerrilJM-resume
  style: resume
  sections_dir: Sections
name: Jesús M. Rueda-Becerril
credentials: Ph.D.
