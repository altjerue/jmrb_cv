sections:
  - title: Professional Summary
    paragraph: >-
      Computational physicist who turns complex physical models into fast,
      tested software and turns large scientific datasets into calibrated
      models. Ph.D. in Physics and ten years building simulation codes and the
      data pipelines around them: author of Paramo, an open-source
      Fortran/OpenMP radiative-transfer library used by other research groups;
      led a 7-person upgrade of the PatchworkMHD black-hole simulation code on
      the Frontera supercomputer; mapped wetland probability across a
      2,160 km² watershed with random-forest models. Nine peer-reviewed
      articles and Co-I on a funded NASA Fermi Guest Investigator grant.

  - title: Skills
    skills:
      - label: ML & Data
        text: >-
          Scientific ML, PyTorch, TensorFlow, scikit-learn, NumPy, SciPy,
          Pandas, Astropy, random forest, SVM, neural networks,
          gradient-based optimization, parameter estimation, uncertainty
          quantification, synthetic dataset generation
      - label: Scientific Computing & HPC
        text: >-
          Numerical PDEs (Fokker–Planck, advection–diffusion), radiative
          transfer, relativistic MHD, Lagrangian particle dynamics,
          finite-difference/finite-volume methods, numerical linear algebra,
          OpenMP, MPI, OpenACC, SLURM, PBS, HDF5
      - label: Geospatial & Remote Sensing
        text: >-
          Sentinel-1/2 multispectral imagery, DEM terrain analysis,
          raster/vector pipelines, QGIS, geospatial feature engineering
      - label: Languages
        text: Python, C/C++, Fortran, Rust, R, SQL, Java, Julia, Shell
      - label: Tools
        text: >-
          Git, Docker, Azure, Jenkins, OpenShift, Kafka, Splunk, Jira,
          ParaView, VisIt

  - title: Experience
    entries:
      - heading: Independent Contractor
        right: Jan 2026 – Present
        sub: Mercor
        sub_right: Remote
        intro: >-
          Physics subject-matter expert evaluating frontier language models
          for a leading AI lab.
        bullets:
          - >-
            Reviewed 50+ expert-level problems in physics, hydrodynamics,
            astrophysics, and cosmology; wrote original prompts that stumped
            frontier models and co-developed others with fellow writers.
          - >-
            Diagnose failure modes in model reasoning and write structured
            feedback to improve scientific accuracy.
          - >-
            Benchmark model performance and quality-check solutions to
            complex STEM problems.

      - heading: Spatial Data Scientist
        right: May 2025 – Jan 2026
        sub: TealWaters
        sub_right: Seattle, WA
        intro: >-
          Built geospatial ML pipelines and optimized terrain-analysis code
          for wetland mapping.
        bullets:
          - >-
            Mapped wetland probability across the 2,160 km² Skykomish
            watershed with the Wetland Intrinsic Potential (WIP) random-forest
            model, reaching >75% accuracy.
          - >-
            Optimized the terrain-modeling code that computes elevation
            derivatives from 1 m, 3 m, and 10 m DEMs over 20 tiles, improving
            its computational performance.
          - >-
            Engineered features from Sentinel-1/2 multispectral imagery and
            terrain derivatives for ML land-cover and wetland models; built
            Python processing tools and QGIS visualizations.
          - >-
            Presented results to managers and decision-makers, trained 2
            colleagues on the WIP tool, and worked with software engineers to
            move prototype tools into production.

      - heading: Independent Researcher & Open-Source Developer
        right: Jan 2024 – May 2025
        sub: Self-directed
        sub_right: Seattle, WA
        intro: >-
          Continued simulation research and open-source development between
          industry roles.
        bullets:
          - >-
            Co-developed Tleco, a Rust/Python toolkit that models radiation
            from relativistic outflows by solving the Fokker–Planck equation
            coupled to radiative transfer; published in ApJ (2024) [9].
          - >-
            Developing WindsOfChange with the UW Forest Mycobiome Lab: a C++/R
            library that simulates wind-driven spore dispersal over forested,
            hilly terrain, parallelized with RcppParallel and OpenMP.
          - >-
            Invited talk on machine learning in environmental science at the
            University of Washington (2024).

      - heading: Software Engineer
        right: Apr 2022 – Jan 2024
        sub: Paychex
        sub_right: Remote
        intro: >-
          Built and tested data-integration services between enterprise
          systems and Oracle E-Business Suite.
        bullets:
          - >-
            Built Java Kafka consumers that moved data between enterprise
            databases, deployed through Jenkins and OpenShift CI/CD pipelines.
          - >-
            Created Splunk dashboards tracking the 200–400 users shared
            between enterprise systems and Oracle EBS, with alerts that
            flagged production incidents.
          - >-
            Wrote full test suites for 5+ Python services in the CI pipeline,
            keeping production defect rates low.
          - Prepared, validated, and analyzed Oracle EBS data with SQL.

      - heading: Postdoctoral Research Associate
        right: Feb 2021 – Apr 2022
        sub: Rochester Institute of Technology
        sub_right: Rochester, NY
        intro: >-
          HPC simulations of supermassive black-hole binaries in an
          NSF-funded project.
        bullets:
          - >-
            Led a 7-person team upgrading PatchworkMHD, a C code for
            magnetohydrodynamic simulations of supermassive black-hole
            binaries.
          - >-
            Added black-hole spin to the simulations with under 5% runtime
            overhead.
          - >-
            Designed and ran benchmark simulations of the new features on
            TACC's Frontera supercomputer (about 1,200 node-hours),
            identifying performance optimization opportunities.
          - >-
            Calibrated Paramo model parameters against Fermi-LAT gamma-ray
            spectra with gradient-based optimization, and supervised a
            graduate student applying gradient descent to the same problem.
          - >-
            Co-authored 2 papers from a multi-institution study of binary
            neutron-star mergers [6, 7] and a third on blazar heating and
            cooling [8].

      - heading: Postdoctoral Research Fellow
        right: Oct 2018 – Nov 2020
        sub: Purdue University
        sub_right: West Lafayette, IN
        intro: >-
          Radiative-transfer modeling of relativistic jets (blazars and
          gamma-ray burst afterglows).
        bullets:
          - >-
            Architected Paramo, an open-source Fortran 95 library that solves
            the Fokker–Planck equation coupled to radiative transfer;
            parallelized and optimized it with OpenMP, making it about 20×
            faster than the original serial code on 5 cores.
          - >-
            Paramo has been adopted by other research groups, including in
            Combi & Siegel (2023).
          - >-
            Co-I on two NASA Fermi Guest Investigator proposals; one was
            funded ($68K) and supported the finding that blazar jets are
            launched with similar energy per baryon, independently of their
            power [5].
          - >-
            Added numerical-integration and OpenMP features to Paramo and
            built Python tools to compute energy losses and spectra of
            high-energy particles in gamma-ray burst afterglows [4].
          - >-
            Mentored 3 graduate students (1 M.S., 2 Ph.D.), co-authoring
            papers with each.
          - >-
            Wrote Python scripts for statistical modeling of the COVID-19
            outbreak in Mexico with a multidisciplinary group, and co-wrote
            Spanish-language infographics and blog posts against
            misinformation.

      - heading: Postdoctoral Research Fellow
        right: Jan 2018 – Sep 2018
        sub: Universidad Michoacana de San Nicolás de Hidalgo
        sub_right: Morelia, Mexico
        bullets:
          - >-
            Built a Python pipeline that turned GRTrans black-hole simulation
            images into training data for an SVM classifier of black-hole
            spin (grayscale conversion, intensity normalization, spatial
            feature extraction).
          - >-
            Released an open-source Python tool for computing
            radiative-transfer spectra and light curves in relativistic
            astrophysics.
          - >-
            Organized an HDF5 workshop to train graduate students in
            high-volume data storage.

      - heading: Graduate Research Assistant
        right: Oct 2011 – Jul 2017
        sub: Universitat de València
        sub_right: Valencia, Spain
        bullets:
          - >-
            Automated runs of the C-SPEV radiative-transfer code with Shell
            and Python pipelines: 10–60 simulations per project and tens of
            GB of HDF5 output, with data-quality checks for downstream
            analysis.
          - >-
            Analyzed multi-wavelength observations from the NASA Fermi-LAT
            telescope and the Very Long Baseline Array (VLBA), including
            cross-matching sources across catalogs by sky coordinates and
            fitting log-parabola spectra.
          - >-
            Fit C-SPEV simulation models to telescope data, identifying
            spectral and light-curve patterns that quantify the magnetization
            of plasma in blazars.
          - >-
            Extended C-SPEV to compute discrete and continuous spectra from
            particle distributions of arbitrary shape, without affecting
            simulation runtime.
          - Published 2 first-author papers in MNRAS [2, 3].

