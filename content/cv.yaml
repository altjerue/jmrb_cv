output: RuedaBecerrilJM-CV-plain
# moderncv version (see content/README.md)
moderncv:
  output: RuedaBecerrilJM-CV
  style: banking2
  sections_dir: Sections
  # raw LaTeX for the hand-edited Sections/publications.tex: \mybibitem and
  # the journal abbreviations (\apj, \mnras, ...)
  preamble:
    - \input{bib_setup3}
    - \input{newmacros}
name: Jesús M. Rueda-Becerril
credentials: Ph.D.
contact:
  - - Seattle, WA
    - "[jm.ruebe@gmail.com](mailto:jm.ruebe@gmail.com)"
    - +1 (765) 430-2330
    - "[linkedin.com/in/jeruebe](https://linkedin.com/in/jeruebe)"
  - - "[altjerue.github.io](https://altjerue.github.io)"
    - "[github.com/altjerue](https://github.com/altjerue)"
